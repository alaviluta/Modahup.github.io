<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModaHub - Iniciar Sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- Header Fijo -->
    <header>
        <div class="header-container">
            <div>
                <h2>ModaHub</h2>
                <p id="sesion"></p>
                <div id="botonCerrar"></div>
            </div>
            <nav class="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="mapa.html">Mapa</a>
                <a href="tiendas.html">Tiendas</a>
                <a href="curso.html">Curso</a>
                <a href="blog.html">Blog</a>
                <a href="cv.html">CV</a>
                <a href="preguntas.html">Preguntas</a>
                <a href="contacto.html">Contacto</a>
                <a href="extras.html">Extras</a>
                <a href="ranking.html">Ranking</a>
                <a href="iniciosecion.html" style="text-decoration: underline;">Inicio de sesión</a>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content">

        <div class="encabezado-pagina">
            <h1>Acceso a la Comunidad ModaHub</h1>
        </div>

        <section class="seccion-bloque" style="max-width: 480px; margin: 0 auto;">
            <h2>Ingresá a tu Cuenta</h2>

            <form id="loginForm" onsubmit="guardarSesion(event)">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Usuario o Email:</label>
                    <input type="text" id="usuarioInput" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;" required>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px;">Contraseña:</label>
                    <input type="password" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;" required>
                </div>

                <div style="display: flex; justify-content: center; gap: 15px; width: 100%;">
                    <button type="submit" class="btn-accion">Entrar</button>
                    <button type="button" class="btn">Registrarse</button>
                </div>
            </form>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <div class="footer-copy">
                <p>&copy; 2026 ModaHub - Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <script>
        let usuario = localStorage.getItem("usuarioModaHub");
        if (usuario) {
            document.getElementById("sesion").innerHTML = "Sesión iniciada: " + usuario;
            document.getElementById("botonCerrar").innerHTML = '<button class="btn" onclick="cerrarSesion()">Cerrar sesión</button>';
        }

        function guardarSesion(e) {
            e.preventDefault();
            let nombreUsuario = document.getElementById("usuarioInput").value;
            if (nombreUsuario.trim() !== "") {
                localStorage.setItem("usuarioModaHub", nombreUsuario);
                window.location.href = "index.html";
            }
        }

        function cerrarSesion() {
            localStorage.removeItem("usuarioModaHub");
            location.reload();
        }
    </script>

</body>

</html>
